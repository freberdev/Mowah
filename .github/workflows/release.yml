# Builds Mowah.exe and publishes it as a GitHub Release when a version tag is pushed:
#
#   git tag v1.0.1
#   git push origin v1.0.1
#
# The tag must match the version in windows/Cargo.toml, with a leading "v".
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches windows/Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' windows/Cargo.toml | head -n 1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in windows/Cargo.toml"
            exit 1
          fi

      - name: Install the Windows cross-compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Add the Windows build target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Run the tests
        working-directory: windows
        run: cargo test --locked

      - name: Build Mowah.exe
        run: windows/build.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/Mowah.exe
          gh release create "$GITHUB_REF_NAME" dist/Mowah.exe \
            --title "Mowah $GITHUB_REF_NAME" \
            --generate-notes
