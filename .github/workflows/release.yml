# Builds both apps and publishes them in one GitHub Release when a version tag
# is pushed on its own:
#
#   git tag v1.1.1
#   git push origin v1.1.1
#
# The tag must match the version in windows/Cargo.toml, with a leading "v".
#
# The Mac app built here is signed to run locally only. A release made by hand
# with `gh release create`, which carries the signed and notarised Mac app,
# creates its tag and its release in one step. This workflow then finds the
# release already there and leaves it alone.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.release.outputs.exists }}
    steps:
      - name: Look for a release with this tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release $GITHUB_REF_NAME already exists, so nothing is built."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the version
        run: tools/check_version_tag.sh "$GITHUB_REF_NAME"

      - name: Install the Windows cross-compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Add the Windows build target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Run the tests
        working-directory: windows
        run: cargo test --locked

      - name: Build Mowah.exe
        run: windows/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/Mowah.exe
          if-no-files-found: error

  macos:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the version
        run: tools/check_version_tag.sh "$GITHUB_REF_NAME"

      - name: Run the tests
        working-directory: macos/MowahCore
        run: swift test

      - name: Check that every text exists in both languages
        run: python3 tools/check_strings.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Mowah.app
        run: macos/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/Mowah-mac.zip
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum dist/Mowah.exe dist/Mowah-mac.zip
          gh release create "$GITHUB_REF_NAME" dist/Mowah.exe dist/Mowah-mac.zip \
            --title "Mowah $GITHUB_REF_NAME" \
            --generate-notes
